name: Linux build and regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ['OFF', 'ON']
    env:
      BLAZER_INSTALL_DEPS: '1'
      BLAZER_SANITIZERS: ${{ matrix.sanitizers }}
      BLAZER_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Build and run all software tests
        run: bash tools/ci-linux.sh "$GITHUB_WORKSPACE" /tmp/blazer-build
